<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LA-RP FiveM — Web Auth & Support</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>LA-RP Support</h1>
      <div id="status">Backend: <span id="backend-status">unbekannt</span></div>
    </header>

    <main>
      <section id="auth-section" class="card">
        <h2>Login / Registrierung</h2>
        <div class="cols">
          <form id="loginForm" class="box">
            <h3>Login</h3>
            <input id="login-username" placeholder="Benutzername" />
            <input id="login-password" type="password" placeholder="Passwort" />
            <button id="loginBtn" type="button">Login</button>
          </form>

          <form id="registerForm" class="box">
            <h3>Registrieren</h3>
            <input id="reg-identifier" placeholder="FiveM Identifier (license:xxx)" />
            <input id="reg-username" placeholder="Benutzername" />
            <input id="reg-password" type="password" placeholder="Passwort" />
            <button id="regBtn" type="button">Registrieren</button>
          </form>
        </div>
      </section>

      <section id="dashboard" class="card hidden">
        <h2>Dashboard</h2>
        <div class="cols">
          <div class="box">
            <h3>Ticket erstellen</h3>
            <input id="ticket-title" placeholder="Kurzer Titel" />
            <textarea id="ticket-desc" placeholder="Beschreibung"></textarea>
            <button id="createTicketBtn" type="button">Ticket erstellen</button>
          </div>

          <div class="box">
            <h3>Meine Tickets</h3>
            <ul id="myTickets"></ul>
          </div>
        </div>
      </section>

      <section id="support-ui" class="card hidden">
        <h2>Supporter UI</h2>
        <div class="box">
          <label><input type="checkbox" id="support-ready"> Ich bin bereit</label>
          <h4>Queue</h4>
          <ul id="queueList"></ul>
        </div>
      </section>

      <section id="call-area" class="card hidden">
        <h2>Call</h2>
        <div class="box">
          <video id="localVideo" autoplay muted playsinline></video>
          <video id="remoteVideo" autoplay playsinline></video>
          <div>
            <button id="endCallBtn" type="button">Call beenden</button>
          </div>
        </div>
      </section>

    </main>

    <footer>
      <small>Bearbeite <code>app.js</code> und setze BACKEND_URL auf deine Backend-URL (https)</small>
    </footer>
  </div>

  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
