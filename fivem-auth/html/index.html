<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FiveM Register</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div id="app">
    <div class="box">
      <h2>Ingame Registrierung</h2>
      <form id="regForm">
        <input id="identifier" type="text" readonly />
        <input id="username" type="text" placeholder="Benutzername" required />
        <input id="password" type="password" placeholder="Passwort" required />
        <button type="submit">Registrieren</button>
      </form>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
